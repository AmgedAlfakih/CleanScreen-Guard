name: Build & Release CleanScreen Guard (Rust v2)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., 2.0.0)"
        required: true
        default: "2.0.0"
  push:
    tags:
      - "v2*"

permissions:
  contents: write

jobs:
  build-windows-rust:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine release version
        id: meta
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $ver = "${{ inputs.version }}".TrimStart("v")
          } else {
            $ver = "${{ github.ref_name }}".TrimStart("v")
          }
          echo "version=$ver" >> $env:GITHUB_OUTPUT
          echo "tag=v$ver" >> $env:GITHUB_OUTPUT

      - name: Set up Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Fetch Microsoft ONNX Runtime DirectML DLLs
        shell: pwsh
        run: |
          .\scripts\fetch_runtime.ps1

      - name: Fetch NudeNet 320n model & convert to FP16
        shell: pwsh
        run: |
          pip install --quiet nudenet onnx onnxconverter-common onnxruntime
          python -c "import os, shutil, nudenet, onnx; from onnxconverter_common import float16; src = os.path.join(os.path.dirname(nudenet.__file__), '320n.onnx'); shutil.copy(src, 'runtime/320n.onnx'); m = float16.convert_float_to_float16(onnx.load(src), keep_io_types=True, disable_shape_infer=True); onnx.save(m, 'runtime/320n_fp16.onnx'); print('FP16 model ready!')"

      - name: Build CleanScreenGuard.exe (Release)
        shell: pwsh
        run: |
          cargo build --release

      - name: Compile Windows Installer (Inno Setup)
        shell: pwsh
        run: |
          $isccCandidates = @(
            "$env:ProgramFiles\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $iscc = $isccCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = $isccCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          & $iscc "/DMyAppVersion=${{ steps.meta.outputs.version }}" "installer.iss"

      - name: Create Release & Attach Setup.exe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ver = "${{ steps.meta.outputs.version }}"
          $tag = "${{ steps.meta.outputs.tag }}"
          $setupExe = "dist\CleanScreenGuard_Setup_$ver.exe"
          $sha256 = (Get-FileHash $setupExe -Algorithm SHA256).Hash
          $sizeMb = [math]::Round((Get-Item $setupExe).Length / 1MB, 1)

          $notes = @"
          ## CleanScreen Guard $tag (Native Rust Edition — Windows 11)

          Complete native **Rust** rewrite of CleanScreen Guard (~$sizeMb MB installer, ~40–60 MB RAM, zero Python/Qt/OpenCV bloat).

          ### Highlights
          - **Native DXGI Desktop Duplication + UpdateLayeredWindow:** Raw BGRA capture and per-pixel-alpha click-through overlay with ``WDA_EXCLUDEFROMCAPTURE``.
          - **DirectML GPU + FP16:** Powered by ``ort`` 2.0 + Microsoft ONNX Runtime DirectML with Power-Saving iGPU, Dedicated RTX/RX, and CPU-only modes.
          - **Async AI Thread + Pure-Rust Motion Tracking:** Smooth 24–30 FPS box tracking between AI keyframes, Adaptive Scan Rate, and 0% GPU True Idle Sleep.
          - **Windows 11 WebView2 Settings (EN / العربية RTL):** Crisp dark-mode UI with zero extra installer size.

          ### Security
          - **Cloud-Built from Public Source** via GitHub Actions.
          - **SHA-256:** ``$sha256``

          ---
          *Built with AI assistance using Google Gemini. Open-source under **AGPL-3.0**.*
          "@

          Set-Content "release_notes.md" $notes -Encoding UTF8
          $ErrorActionPreference = "Continue"
          gh release view $tag *> $null
          $exists = ($LASTEXITCODE -eq 0)
          $ErrorActionPreference = "Stop"

          if ($exists) {
            gh release upload $tag $setupExe --clobber
            gh release edit $tag --notes-file release_notes.md
          } else {
            gh release create $tag $setupExe --title "CleanScreen Guard $tag (Rust)" --notes-file release_notes.md
          }
