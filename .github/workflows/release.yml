name: Build & Release CleanScreen Guard

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., 1.0.0)"
        required: true
        default: "1.0.0"
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine release version
        id: meta
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $ver = "${{ inputs.version }}".TrimStart("v")
          } else {
            $ver = "${{ github.ref_name }}".TrimStart("v")
          }
          echo "version=$ver" >> $env:GITHUB_OUTPUT
          echo "tag=v$ver" >> $env:GITHUB_OUTPUT

      - name: Inject official GitHub repo URL & version into app
        shell: pwsh
        run: |
          $ver = "${{ steps.meta.outputs.version }}"
          $repoUrl = "${{ github.server_url }}/${{ github.repository }}"
          $cfg = Get-Content "src/config.py" -Raw
          $cfg = $cfg -replace 'APP_VERSION\s*=\s*"[^"]*"', "APP_VERSION = `"$ver`""
          $cfg = $cfg -replace 'OFFICIAL_GITHUB_URL\s*=\s*"[^"]*"', "OFFICIAL_GITHUB_URL = `"$repoUrl`""
          Set-Content "src/config.py" $cfg -Encoding UTF8 -NoNewline

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (DirectML GPU + PyInstaller)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip uninstall -y onnxruntime onnxruntime-directml
          pip install onnxruntime-directml pyinstaller

      - name: Build CleanScreenGuard.exe
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir `
            --name "CleanScreenGuard" `
            --icon "assets\app_icon.ico" `
            --version-file "version_info.txt" `
            --add-data "assets;assets" `
            --collect-all onnxruntime `
            --collect-data nudenet `
            --collect-all dxcam `
            --collect-all comtypes `
            --exclude-module PySide6.QtWebEngineCore `
            --exclude-module PySide6.QtWebEngineWidgets `
            --exclude-module PySide6.Qt3DCore `
            --exclude-module PySide6.Qt3DRender `
            --exclude-module PySide6.QtMultimedia `
            --exclude-module PySide6.QtCharts `
            --exclude-module PySide6.QtQml `
            --exclude-module PySide6.QtQuick `
            --exclude-module tkinter `
            --exclude-module matplotlib `
            --exclude-module scipy `
            app.py

      - name: Compile Windows Installer (Inno Setup)
        shell: pwsh
        run: |
          $isccCandidates = @(
            "$env:ProgramFiles\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $iscc = $isccCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = $isccCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) {
            $cmd = Get-Command iscc.exe -ErrorAction SilentlyContinue
            if ($cmd) { $iscc = $cmd.Source }
          }
          if (-not $iscc) {
            throw "ISCC.exe not found after installation."
          }
          Write-Host "Using Inno Setup compiler: $iscc"
          & $iscc "/DMyAppVersion=${{ steps.meta.outputs.version }}" "installer.iss"

      - name: Create Release & Attach Setup.exe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $ver = "${{ steps.meta.outputs.version }}"
          $tag = "${{ steps.meta.outputs.tag }}"
          $setupExe = "dist\CleanScreenGuard_Setup_$ver.exe"
          $sha256 = (Get-FileHash $setupExe -Algorithm SHA256).Hash

          $notes = @"
          ## CleanScreen Guard $tag (Windows 11)

          Free, 100% local, GPU-accelerated Windows 11 desktop overlay that detects and blurs NSFW and suggestive content in real time across **games, videos, browsers, and every connected monitor**.

          ### Highlights
          - **Universal & Game-Friendly:** Blurs detected regions on screen without modifying game files (use **Borderless Windowed** mode in games).
          - **Fast & Local (DirectML GPU):** Runs 100% offline on NVIDIA, AMD, and Intel GPUs with low CPU usage.
          - **Live Settings & Anti-Flicker:** Click the system tray icon to adjust sensitivity, anti-flicker hold time, blur strength, scan FPS, and categories.
          - **Custom & Dual-Model Support:** Ships with NudeNet ``320n`` built in, plus a Model Selector for ``640m.onnx`` or anime YOLO ``.onnx`` models.
          - **English & Arabic (العربية):** Instant Right-to-Left (RTL) interface switching and optional **Start with Windows**.

          ### Installation
          1. Download **``CleanScreenGuard_Setup_$ver.exe``** below and run the installer.
          2. Click the **CleanScreen Guard** icon in the Windows system tray to open Settings or switch to **العربية (Arabic)**.

          ### Security & SmartScreen Notice
          - **Cloud-Built from Public Source:** This installer was compiled automatically by GitHub Actions directly from this repository's public code.
          - **SHA-256:** ``$sha256``
          - **Windows SmartScreen:** Because this is a free, unsigned open-source ``.exe``, Windows may show *"Windows protected your PC"*. Click **More info → Run anyway**.

          ---
          *Built with AI assistance using the **Google Gemini 4 Neon** model. Open-source under **AGPL-3.0**.*
          "@

          Set-Content "release_notes.md" $notes -Encoding UTF8

          $ErrorActionPreference = "Continue"
          gh release view $tag *> $null
          $exists = ($LASTEXITCODE -eq 0)
          $ErrorActionPreference = "Stop"

          if ($exists) {
            gh release upload $tag $setupExe --clobber
            gh release edit $tag --notes-file release_notes.md
          } else {
            gh release create $tag $setupExe --title "CleanScreen Guard $tag" --notes-file release_notes.md
          }
