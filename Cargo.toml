[package]
name = "clean-screen-guard"
version = "2.0.0"
edition = "2024"
description = "CleanScreen Guard — Real-Time Desktop NSFW Blur Overlay (Native Rust)"
license = "AGPL-3.0-only"
build = "build.rs"

[[bin]]
name = "CleanScreenGuard"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
half = "2.4"
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "api-24", "directml", "load-dynamic", "half"] }
tao = "0.37"
wry = "0.57"
tray-icon = "0.26"
image = { version = "0.25", default-features = false, features = ["ico"] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
